<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思口语 Part 2 · 自动抽卡</title>
<style>
  :root {
    --bg: #0d1320; --panel: #151d2e; --panel2: #1a2338; --line: #273352;
    --ink: #e8eef8; --dim: #8b9bb8; --accent: #6d8dff; --accent2: #4ad0a0;
    --warn: #ffb454; --danger: #ff6b6b;
    --prep: #ffb454; --talk: #4ad0a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: radial-gradient(1000px 640px at 70% -10%, #1b2540 0%, var(--bg) 62%);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px;
  }
  header { width: 100%; max-width: 1060px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .deck-info { color: var(--dim); font-size: 12.5px; }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  .tools button, .row button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  .tools button:hover, .row button:hover { background: #243050; }
  .tools button:disabled, .row button:disabled { opacity: .45; cursor: not-allowed; }
  .tools input {
    width: 58px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 5px 8px; font-size: 13px; text-align: center;
  }
  .tools label { font-size: 12px; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; }

  main { width: 100%; max-width: 1060px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card-wrap { perspective: 1400px; width: min(460px, 92vw); }
  .card {
    position: relative; width: 100%; aspect-ratio: 5/6.2;
    transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.25,1.05);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px;
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line);
  }
  .back {
    background: linear-gradient(135deg, #1c2a4e 0%, #27396a 55%, #1a2543 100%);
    align-items: center; justify-content: center; cursor: pointer; user-select: none;
  }
  .back::before {
    content: ""; position: absolute; inset: 10px; border-radius: 12px;
    border: 2px dashed #3b4f86; opacity: .7;
  }
  .back .big { font-size: 52px; font-weight: 800; letter-spacing: 2px; color: #9db4ff; text-shadow: 0 6px 24px #3150c0aa; }
  .back .small { margin-top: 10px; color: #7e93cf; font-size: 12.5px; letter-spacing: 1px; }
  .back:hover .big { text-shadow: 0 6px 30px #4a72ffcc; }
  .front {
    transform: rotateY(180deg); background: linear-gradient(160deg, #f8f9ff 0%, #ecefff 100%);
    color: #1c2540; padding: 22px 24px; text-align: left;
  }
  .front .kicker { font-size: 11px; letter-spacing: 2px; color: #6d8dff; font-weight: 700; text-transform: uppercase; }
  .front h2 { font-size: 19.5px; line-height: 1.35; margin: 8px 0 12px; }
  .front .ys { font-size: 12px; color: #7a86a8; margin-bottom: 6px; font-style: italic; }
  .front ul { margin: 0; padding-left: 18px; font-size: 14.5px; line-height: 1.9; }
  .front .foot {
    margin-top: auto; padding-top: 10px; font-size: 11.5px; color: #98a2c0; font-style: italic;
    border-top: 1px solid #dde3f5;
  }
  .stack { position: relative; width: min(460px, 92vw); height: 0; }
  .stack i {
    position: absolute; left: 50%; translate: -50% 0; width: 96%; height: 14px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
  }
  .stack i:nth-child(1) { top: 8px; } .stack i:nth-child(2) { top: 15px; width: 91%; opacity: .6; }

  .timer { display: flex; align-items: center; gap: 16px; }
  .ring { width: 108px; height: 108px; }
  .ring .track { stroke: #223052; }
  .ring .prog { stroke: var(--prep); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .ring.talking .prog { stroke: var(--talk); }
  .ring text { fill: var(--ink); font-size: 21px; font-weight: 700; }
  .ring .lab { fill: var(--dim); font-size: 9.5px; font-weight: 400; letter-spacing: 1px; }
  .phase { font-size: 13px; color: var(--dim); line-height: 1.7; }
  .phase b { font-size: 15px; color: var(--ink); display: block; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-primary { background: var(--accent) !important; border-color: var(--accent) !important; font-weight: 600; }
  .btn-primary:hover { background: #5a7bfd !important; }
  .btn-talk { background: var(--accent2) !important; border-color: var(--accent2) !important; color: #06281c !important; font-weight: 700; }

  .side { display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: .5px; }
  .bands { display: flex; gap: 6px; flex-wrap: wrap; }
  .bands button { min-width: 34px; padding: 6px 0; text-align: center; }
  .bands button.sel { background: var(--accent2); border-color: var(--accent2); color: #06281c; font-weight: 700; }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; background: #0f1626; color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font: 13px/1.6 inherit;
  }
  textarea:focus { outline: 2px solid #6d8dff55; }
  .hist { max-height: 300px; overflow-y: auto; font-size: 12.5px; }
  .hist table { width: 100%; border-collapse: collapse; }
  .hist td { padding: 5px 4px; border-bottom: 1px dashed #223052; vertical-align: top; }
  .hist .t { color: var(--dim); white-space: nowrap; }
  .hist .band { font-weight: 700; color: var(--accent2); width: 30px; text-align: center; }
  .hist .none { color: var(--dim); }
  .kbd {
    display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    padding: 0 6px; font: 11px Consolas, monospace; color: #b9c6e6; background: #141d33;
  }
  .tip { color: var(--dim); font-size: 12px; text-align: center; }
  .flash { animation: flash .45s; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px #4ad0a0aa; } 100% { box-shadow: none; } }
</style>
</head>
<body>
<header>
  <h1>🎴 雅思口语 Part 2 · 自动抽卡</h1>
  <span class="deck-info" id="deckInfo"></span>
  <div class="tools">
    <label><input type="checkbox" id="sndOn" checked> 提示音</label>
    <label>构思 <input type="number" id="prepSec" value="60" min="10" max="300"> s</label>
    <label>独白 <input type="number" id="talkSec" value="120" min="30" max="600"> s</label>
    <button id="btnReshuffle" title="重新洗整副牌">🔀 洗牌</button>
    <button id="btnClearHist" title="清空历史">🗑 历史</button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="stack"><i></i><i></i></div>
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="face back" id="cardBack">
          <div class="big">IELTS</div>
          <div class="small">PART 2 · CUE CARD · 点击或按空格抽卡</div>
        </div>
        <div class="face front">
          <div class="kicker">Part 2 · Cue Card</div>
          <h2 id="qTitle">-</h2>
          <div class="ys">You should say:</div>
          <ul id="qBullets"></ul>
          <div class="foot">You have one minute to think, then speak for one to two minutes.</div>
        </div>
      </div>
    </div>

    <div class="timer">
      <svg class="ring" id="ring" viewBox="0 0 108 108">
        <circle class="track" cx="54" cy="54" r="47" fill="none" stroke-width="8"/>
        <circle class="prog" id="prog" cx="54" cy="54" r="47" fill="none" stroke-width="8"
                stroke-dasharray="295.3" stroke-dashoffset="0" transform="rotate(-90 54 54)"/>
        <text x="54" y="52" text-anchor="middle" id="timeText">--:--</text>
        <text x="54" y="70" text-anchor="middle" class="lab" id="phaseText">READY</text>
      </svg>
      <div class="phase" id="phaseMsg"><b>准备就绪</b>抽一张卡,自动进入 60 秒构思 → 120 秒独白。</div>
    </div>

    <div class="row">
      <button id="btnDraw" class="btn-primary">🎴 抽卡(空格)</button>
      <button id="btnSkipPrep" disabled>⏭ 跳过构思</button>
      <button id="btnPause" disabled>⏸ 暂停</button>
      <button id="btnRestart" disabled>↺ 重置本题</button>
    </div>
    <div class="tip">流程全自动:抽卡 → 构思倒计时(叮)→ 独白倒计时(叮叮)→ 自评。</div>
  </section>

  <section class="side">
    <div class="panel">
      <h3>本题自评 &amp; 笔记(自动保存)</h3>
      <div class="bands" id="bands"></div>
      <div style="height:8px"></div>
      <textarea id="note" placeholder="卡顿点 / 好用的表达 / 下次改进…"></textarea>
    </div>
    <div class="panel">
      <h3>历史记录(本次浏览器内保留)</h3>
      <div class="hist" id="hist"><span class="dim">暂无记录</span></div>
    </div>
  </section>
</main>

<script>
"use strict";

/* ---------------- 题卡库(真题风格 50 题) ---------------- */
var CARDS = [
{ t: "Describe a park or garden you like visiting", b: ["where it is", "how often you go there", "what you often do there", "and explain why you like it"] },
{ t: "Describe a person who has inspired you", b: ["who this person is", "how you know this person", "what this person has done", "and explain why they inspired you"] },
{ t: "Describe a book you have read recently", b: ["what the book is", "when you read it", "what it is about", "and explain whether you would recommend it"] },
{ t: "Describe a place you visited that left a deep impression on you", b: ["where it is", "when you visited it", "who you went with", "and explain why it impressed you"] },
{ t: "Describe a skill you would like to learn", b: ["what the skill is", "why you want to learn it", "how you would learn it", "and explain how it would help you"] },
{ t: "Describe a time when you were late for something", b: ["when it happened", "where you were going", "why you were late", "and explain how you felt about it"] },
{ t: "Describe a useful gift you have received", b: ["what it is", "who gave it to you", "when you received it", "and explain why it is useful"] },
{ t: "Describe a difficult decision you made", b: ["what the decision was", "when you made it", "what options you had", "and explain how it turned out"] },
{ t: "Describe a photograph you like", b: ["what is in the photograph", "when it was taken", "where you keep it", "and explain why you like it"] },
{ t: "Describe a memorable meal you have had", b: ["what the meal was", "where you had it", "who you had it with", "and explain why it was memorable"] },
{ t: "Describe a childhood memory you have", b: ["what the memory is", "when it happened", "who you were with", "and explain why you still remember it"] },
{ t: "Describe a teacher who has influenced you", b: ["who the teacher is", "what subject they taught", "how they influenced you", "and explain why you remember them"] },
{ t: "Describe a long journey you have taken", b: ["where you went", "how you travelled", "who you travelled with", "and explain what you learned from it"] },
{ t: "Describe a piece of technology you cannot live without", b: ["what it is", "when you got it", "how you use it", "and explain why it is so important to you"] },
{ t: "Describe a sport or physical activity you enjoy", b: ["what it is", "when you started doing it", "how often you do it", "and explain why you enjoy it"] },
{ t: "Describe a family celebration you have attended", b: ["what the celebration was", "when it happened", "who was there", "and explain why it was special"] },
{ t: "Describe something you own that you really value", b: ["what it is", "when you got it", "how you use it", "and explain why you value it"] },
{ t: "Describe an old building that you like", b: ["where it is", "what it looks like", "what you know about its history", "and explain why you like it"] },
{ t: "Describe a street market you have visited", b: ["where it is", "what is sold there", "what you bought or saw", "and explain how you felt about it"] },
{ t: "Describe a time when you helped someone", b: ["who you helped", "when it happened", "how you helped them", "and explain how you felt about it"] },
{ t: "Describe a law you think is important", b: ["what the law is", "what it does", "how it affects people", "and explain why you think it is important"] },
{ t: "Describe an environmental problem in your area", b: ["what the problem is", "what causes it", "how it affects people", "and explain what should be done about it"] },
{ t: "Describe a website or app you use often", b: ["what it is", "what you use it for", "how often you use it", "and explain why you find it useful"] },
{ t: "Describe a TV programme or series you enjoy", b: ["what it is", "what it is about", "when you watch it", "and explain why you enjoy it"] },
{ t: "Describe a healthy habit you have", b: ["what the habit is", "when you started it", "how you keep it going", "and explain its benefits"] },
{ t: "Describe a famous person you admire", b: ["who the person is", "what they are famous for", "what they have achieved", "and explain why you admire them"] },
{ t: "Describe a neighbour you like", b: ["who they are", "how you got to know them", "what kind of person they are", "and explain why you get along"] },
{ t: "Describe a subject you enjoyed at school", b: ["what the subject was", "who taught it", "what you learned", "and explain why you enjoyed it"] },
{ t: "Describe a job you would like to have in the future", b: ["what the job is", "what it involves", "what skills it needs", "and explain why you want it"] },
{ t: "Describe a time when you lost something important", b: ["what you lost", "where and when you lost it", "what you did to find it", "and explain how you felt"] },
{ t: "Describe an important letter or email you have received", b: ["who it was from", "when you received it", "what it was about", "and explain why it was important"] },
{ t: "Describe a piece of good news you heard recently", b: ["what the news was", "when you heard it", "who told you about it", "and explain why it was good news"] },
{ t: "Describe a festival or public holiday you enjoy", b: ["what it is", "when it takes place", "what people do", "and explain why you enjoy it"] },
{ t: "Describe a museum or gallery you have visited", b: ["where it is", "what you saw there", "who you went with", "and explain why it impressed you"] },
{ t: "Describe a place near water that you like", b: ["where it is", "when you visit it", "what you do there", "and explain why you like it"] },
{ t: "Describe a crowded place you have been to", b: ["where it is", "when you went there", "why it was crowded", "and explain how you felt about it"] },
{ t: "Describe a quiet place you like", b: ["where it is", "how often you go there", "what you do there", "and explain why you like the quiet"] },
{ t: "Describe a time when you felt proud of yourself", b: ["what you did", "when it happened", "why you felt proud", "and explain how you celebrated"] },
{ t: "Describe a day when the weather was unusual", b: ["when it was", "what the weather was like", "how it affected your plans", "and explain how you felt about it"] },
{ t: "Describe something that broke and you fixed or repaired", b: ["what it was", "how it broke", "what you did about it", "and explain the result"] },
{ t: "Describe something you made by yourself", b: ["what it was", "when you made it", "how you made it", "and explain why you made it"] },
{ t: "Describe a party you have attended", b: ["when it was", "where it was held", "what happened at the party", "and explain how you felt about it"] },
{ t: "Describe an interesting conversation you have had", b: ["who you talked with", "when it happened", "what you talked about", "and explain why it was interesting"] },
{ t: "Describe a piece of useful advice someone gave you", b: ["who gave you the advice", "when it was", "what the advice was", "and explain how it helped you"] },
{ t: "Describe a language you would like to learn", b: ["what it is", "why you want to learn it", "how you would learn it", "and explain what difficulties you might have"] },
{ t: "Describe a company or shop you think is successful", b: ["what it is", "what it does or sells", "how you know about it", "and explain why you think it is successful"] },
{ t: "Describe a product you bought that you are satisfied with", b: ["what it is", "where you bought it", "how you use it", "and explain why you are satisfied with it"] },
{ t: "Describe a time when you were very busy", b: ["when it was", "why you were busy", "what you had to do", "and explain how you managed it"] },
{ t: "Describe a toy you loved as a child", b: ["what it was", "who gave it to you", "how you played with it", "and explain why you loved it"] },
{ t: "Describe your favourite season or time of year", b: ["which season it is", "what the weather is like then", "what you usually do", "and explain why it is your favourite"] }
];

/* ---------------- 状态 ---------------- */
var deck = [];
var currentIdx = -1;         /* 当前卡在卡组里的下标(用于 notes/rating 定位) */
var phase = "idle";          /* idle | prep | talk | done */
var remain = 0, total = 0, lastTick = 0, paused = false, rafId = 0;

var $ = function (id) { return document.getElementById(id); };
var RING_LEN = 295.3;

var store = {
  get hist() { try { return JSON.parse(localStorage.getItem("ieltscc.hist") || "[]"); } catch (e) { return []; } },
  set hist(v) { localStorage.setItem("ieltscc.hist", JSON.stringify(v.slice(-200))); },
  get notes() { try { return JSON.parse(localStorage.getItem("ieltscc.notes") || "{}"); } catch (e) { return {}; } },
  set notes(v) { localStorage.setItem("ieltscc.notes", JSON.stringify(v)); }
};

/* ---------------- 声音(WebAudio,零素材) ---------------- */
function beep(times, freq) {
  if (!$("sndOn").checked || !("AudioContext" in window || "webkitAudioContext" in window)) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx = beep._ctx || (beep._ctx = new Ctx());
  if (ctx.state === "suspended") ctx.resume();
  for (var i = 0; i < times; i++) {
    (function (i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.22);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + i * 0.22 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.22 + 0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.22); o.stop(ctx.currentTime + i * 0.22 + 0.2);
    })(i);
  }
}

/* ---------------- 牌组 ---------------- */
function shuffle() {
  deck = CARDS.map(function (_, i) { return i; });
  for (var i = deck.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
  renderDeckInfo();
}
function renderDeckInfo() {
  $("deckInfo").textContent = "牌库 " + CARDS.length + " 张 · 剩余 " + deck.length + " 张(不重复,抽完自动洗牌)";
}

/* ---------------- 抽卡 ---------------- */
function draw() {
  if (phase === "prep" || phase === "talk") return; /* 计时中先完成/重置 */
  if (deck.length === 0) shuffle();
  currentIdx = deck.pop();
  var c = CARDS[currentIdx];
  $("qTitle").textContent = c.t;
  var ul = $("qBullets"); ul.innerHTML = "";
  c.b.forEach(function (b) {
    var li = document.createElement("li"); li.textContent = b; ul.appendChild(li);
  });
  $("card").classList.add("flipped");
  renderDeckInfo();
  loadNote();
  renderBands(null);
  var prep = Math.max(10, parseInt($("prepSec").value, 10) || 60);
  startPhase("prep", prep);
}
$("cardBack").addEventListener("click", draw);
$("btnDraw").addEventListener("click", draw);
document.addEventListener("keydown", function (e) {
  if (e.code === "Space" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); draw(); }
});

/* ---------------- 计时器 ---------------- */
function fmt(s) {
  var m = Math.floor(s / 60), ss = Math.ceil(s % 60);
  if (ss === 60) { m += 1; ss = 0; }
  return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
}
function setRing(frac) {
  $("prog").style.strokeDashoffset = String(RING_LEN * (1 - Math.max(0, Math.min(1, frac))));
}
function startPhase(p, seconds) {
  phase = p; total = seconds; remain = seconds; lastTick = performance.now(); paused = false;
  $("btnPause").textContent = "⏸ 暂停";
  $("btnSkipPrep").disabled = (p !== "prep");
  $("btnPause").disabled = false;
  $("btnRestart").disabled = false;
  $("btnDraw").disabled = true;
  $("ring").classList.toggle("talking", p === "talk");
  $("phaseMsg").innerHTML = p === "prep"
    ? "<b>构思中…</b>在草稿纸上速写 4 个提示点的关键词。"
    : "<b>开始说!</b>对着麦克风讲满两分钟,覆盖全部 4 个点。";
  beep(p === "prep" ? 1 : 2, p === "prep" ? 660 : 880);
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}
function tick(now) {
  if (phase === "idle" || phase === "done") return;
  if (!paused) {
    remain -= (now - lastTick) / 1000;
    if (remain <= 0) {
      if (phase === "prep") { startPhase("talk", Math.max(30, parseInt($("talkSec").value, 10) || 120)); return; }
      return finishTalk();
    }
  }
  lastTick = now;
  $("timeText").textContent = fmt(Math.max(0, remain));
  $("phaseText").textContent = phase === "prep" ? "PREP" : "SPEAK";
  setRing(remain / total);
  rafId = requestAnimationFrame(tick);
}
function finishTalk() {
  phase = "done";
  $("timeText").textContent = "✓";
  $("phaseText").textContent = "DONE";
  setRing(1);
  $("phaseMsg").innerHTML = "<b>时间到!</b>在右侧给自己打个 Band 分,再写两句复盘笔记。";
  $("btnPause").disabled = true; $("btnSkipPrep").disabled = true;
  $("btnDraw").disabled = false;
  beep(3, 990);
  saveHist(false);
}
$("btnSkipPrep").addEventListener("click", function () {
  if (phase === "prep") startPhase("talk", Math.max(30, parseInt($("talkSec").value, 10) || 120));
});
$("btnPause").addEventListener("click", function () {
  if (phase !== "prep" && phase !== "talk") return;
  paused = !paused;
  this.textContent = paused ? "▶ 继续" : "⏸ 暂停";
});
$("btnRestart").addEventListener("click", resetCurrent);
function resetCurrent() {
  cancelAnimationFrame(rafId);
  phase = "idle"; paused = false;
  $("timeText").textContent = "--:--"; $("phaseText").textContent = "READY";
  setRing(1);
  $("phaseMsg").innerHTML = "<b>已重置</b>按「抽卡」再来一张(本题会回到牌堆)。";
  $("btnPause").disabled = true; $("btnSkipPrep").disabled = true; $("btnRestart").disabled = true;
  $("btnDraw").disabled = false;
  if (currentIdx >= 0) { deck.unshift(currentIdx); renderDeckInfo(); }
}

/* ---------------- 自评 / 笔记 / 历史 ---------------- */
(function buildBands() {
  for (var i = 4; i <= 9; i += 0.5) {
    var b = document.createElement("button");
    b.textContent = i.toFixed(1);
    b.dataset.band = String(i);
    b.addEventListener("click", function () {
      renderBands(parseFloat(this.dataset.band));
      saveHist(true);
    });
    $("bands").appendChild(b);
  }
})();
function renderBands(sel) {
  Array.prototype.forEach.call($("bands").children, function (b) {
    b.classList.toggle("sel", sel !== null && parseFloat(b.dataset.band) === sel);
  });
}
function currentKey() {
  return currentIdx >= 0 ? CARDS[currentIdx].t : null;
}
$("note").addEventListener("input", function () {
  var k = currentKey(); if (!k) return;
  var n = store.notes; n[k] = this.value; store.notes = n;
});
function loadNote() {
  var k = currentKey();
  $("note").value = k ? (store.notes[k] || "") : "";
}
function saveHist(withBand) {
  var k = currentKey(); if (!k) return;
  var hist = store.hist;
  var selBtn = document.querySelector("#bands .sel");
  var band = selBtn ? parseFloat(selBtn.dataset.band) : null;
  var existing = hist.filter(function (h) { return h.t === k; })[0];
  if (existing) { existing.at = new Date().toISOString(); if (withBand && band) existing.band = band; }
  else hist.push({ t: k, at: new Date().toISOString(), band: band });
  store.hist = hist;
  renderHist();
  var h = $("hist"); h.classList.remove("flash"); void h.offsetWidth; h.classList.add("flash");
}
function renderHist() {
  var hist = store.hist.slice().reverse();
  if (!hist.length) { $("hist").innerHTML = '<span class="dim">暂无记录</span>'; return; }
  var html = "<table>";
  hist.slice(0, 40).forEach(function (h) {
    var d = new Date(h.at);
    var tm = (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
    var hasNote = store.notes[h.t] ? " 📝" : "";
    html += "<tr><td class='band'>" + (h.band ? h.band.toFixed(1) : "<span class='none'>–</span>") + "</td>" +
            "<td>" + escapeHtml(h.t) + hasNote + "</td><td class='t'>" + tm + "</td></tr>";
  });
  $("hist").innerHTML = html + "</table>";
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
$("btnReshuffle").addEventListener("click", function () { resetCurrent(); shuffle(); });
$("btnClearHist").addEventListener("click", function () {
  if (!confirm("清空历史与全部笔记?")) return;
  store.hist = []; store.notes = {}; renderHist(); loadNote();
});

/* ---------------- 启动 ---------------- */
shuffle();
renderHist();
setRing(1);
</script>
</body>
</html>
